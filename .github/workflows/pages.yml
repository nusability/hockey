name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the build id
        # The same id goes into the page and into version.json, so a running
        # tab can tell whether what it loaded is still what is published.
        run: |
          BUILD="${GITHUB_SHA::12}"
          printf '{ "version": "%s", "time": "%s" }\n' "$BUILD" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > version.json
          sed -i "s|<meta name=\"build\" content=\"[^\"]*\">|<meta name=\"build\" content=\"$BUILD\">|" index.html
          echo "Stamped build $BUILD"
          grep -o '<meta name="build"[^>]*>' index.html
          cat version.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
