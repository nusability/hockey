# AGENTS.md: "Pin runtime-critical deps exact." No ranges, no `+`, no dynamic versions.
[versions]
agp = "9.4.0"
kotlin = "2.4.10"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.08.00"
junit = "4.13.2"
# ADR 0005: Filament draws the scene and the 3D UI. tools/build-materials.sh reads this line —
# the compiled materials must come from the same release.
filament = "1.77.0"
# Triangulates glyph outlines with holes for the extruded 3D text (ADR 0005).
earcut4j = "2.2.2"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
filament-android = { group = "com.google.android.filament", name = "filament-android", version.ref = "filament" }
filament-gltfio = { group = "com.google.android.filament", name = "gltfio-android", version.ref = "filament" }
filament-utils = { group = "com.google.android.filament", name = "filament-utils-android", version.ref = "filament" }
earcut4j = { group = "io.github.earcut4j", name = "earcut4j", version.ref = "earcut4j" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
# AGP 9 ships Kotlin support built in; only the Compose compiler plugin is separate.
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# :core is a pure JVM module (no Android), so it needs the Kotlin JVM plugin, at the same Kotlin.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
