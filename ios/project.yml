# The iOS half of a two-platform product. ADR 0001: a native codebase sharing no executable code
# of ours with android/. The .xcodeproj is generated from this file and never committed.
name: SmashHockey
options:
  # One-way door at registration (conventions.md): decided 2026-09-22 as in.nann.smashhockey,
  # never changed after the first App Store Connect registration.
  bundleIdPrefix: in.nann
  deploymentTarget:
    # ADR 0005 (proposed): iOS 18.
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    # A team id is not a secret; it ships in every signed binary. Same team as flashybird.
    DEVELOPMENT_TEAM: 33N7Q5ZPGX
    GENERATE_INFOPLIST_FILE: "YES"
    # A store field, not an engineering contract; the release lane will set the build number.
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"

# The game's platform-independent core: generated config, deterministic math, the simulation.
packages:
  SmashCore:
    path: SmashCore

targets:
  SmashHockey:
    type: application
    platform: iOS
    dependencies:
      - package: SmashCore
    sources:
      - path: Sources
      # Shared assets and data are referenced from shared/, never copied (ADR 0001, 0005).
      - path: ../shared/assets/worlds/oasis/oasis.usdz
        buildPhase: resources
      - path: ../shared/assets/fonts/LilitaOne-Regular.ttf
        buildPhase: resources
      - path: ../shared/data/motion.json
        buildPhase: resources
    # Keys the generated plist has no build setting for. xcodegen writes ios/Info.plist from this
    # (untracked); GENERATE_INFOPLIST_FILE merges the INFOPLIST_KEY_* settings into it.
    info:
      path: Info.plist
      properties:
        # ProMotion: without this key an iPhone caps every app at 60 Hz (ADR 0005 spike).
        CADisableMinimumFrameDurationOnPhone: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.nann.smashhockey
        INFOPLIST_KEY_CFBundleDisplayName: Smash Hockey 3D
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIRequiresFullScreen: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  SmashHockeyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SmashHockey

schemes:
  SmashHockey:
    build:
      targets:
        SmashHockey: all
    test:
      targets:
        - SmashHockeyTests
        - package: SmashCore/SmashCoreTests
