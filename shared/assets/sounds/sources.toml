# Where every sound file in this directory comes from, and exactly how it was cut from its original.
# Read by tools/prepare-sounds.py, which fetches each [source] (pinned by sha256), cuts every [[clip]],
# levels it by its loudness class and encodes it twice (.m4a for iOS, .ogg for Android), then writes
# LICENSES.md from this file. Nothing in this directory is edited by hand.
#
# The licence rule (owner, 2026-09-22): CC0 / public domain first; CC-BY only with its attribution line
# recorded and flagged; never non-commercial, share-alike, unclear, or ripped audio. Every source below
# is CC0 1.0 — no attribution is owed (the credits in LICENSES.md are a courtesy, not an obligation).
#
# Freesound: the original upload needs a signed-in account to download, so we fetch the public
# high-quality preview (Ogg Vorbis, ~190 kbit/s) of the same sound. CC0 covers every copy of the work;
# the preview is lossy, which is inaudible after our own re-encode at game-SFX sizes. To use the
# lossless original instead, download it from `page`, drop it into .originals/ under the cached name
# and update `url`/`sha256` — the clip times are the same.
#
# Clip fields: `out` (path without extension), `parts` (one or more cuts, [source, start s, end s]
# with an optional pause before each later part as a fourth element), `class` (loudness class, see
# [class] below), `offset_db` (level relative to its class target, default 0), `fade` (fade-out
# seconds, default 0.03), `highpass` (Hz, optional), `stereo` (default false: mono), `note` (what it is, for LICENSES.md). A Kenney part names its file inside
# the pack's zip; start/end may be omitted to take the whole file.

# Loudness classes: each clip is levelled so its loudest 100 ms (RMS, dBFS) sits at `target`, unless
# that would push its sample peak over `ceiling` — then the peak wins and the report says so. Impacts
# are loudest, crowd and stings a little under, the UI well under the match. Loudness of a sound this
# short is its energy over ~100 ms, so a needle-thin crack reads quiet at a full-scale peak: where a
# class sets `max_crest` (dB, peak over loudest-100-ms RMS), a look-ahead limiter (0.5 ms attack, 8 ms
# release) first shaves the peak toward that crest, but by no more than `max_shave` dB, so a crack
# stays a crack — the report lists how many dB each clip lost. The real field-hockey hits are such
# needles that they reach the cap and stay a few dB under the class target (tune by ear: gain_db).
[class.impact]
target = -18.0
ceiling = -2.0
max_crest = 18.0
max_shave = 6.0
[class.crowd]
target = -20.0
ceiling = -2.0
[class.whistle]
target = -19.0
ceiling = -2.0
[class.sting]
target = -20.0
ceiling = -2.0
[class.ui]
target = -24.0
ceiling = -3.0
max_crest = 18.0
max_shave = 6.0
[class.whoosh]
target = -26.0
ceiling = -3.0

