# How to play
"help.title" = { en = "How to play", de = "Spielanleitung" }
"help.1" = { en = "Your players run on their own. You only decide when to let go of the ball.", de = "Deine Spieler laufen von selbst. Du entscheidest nur, wann der Ball losgelassen wird." }
"help.2" = { en = "When one of your players has the ball it circles around them, and an arrow shows where it would go. Touch and hold anywhere to keep it; lift your finger to send it.", de = "Hat einer deiner Spieler den Ball, kreist er um ihn herum, und ein Pfeil zeigt, wohin er fliegen würde. Irgendwo tippen und halten, um ihn zu behalten; Finger heben, um ihn abzuspielen." }
"help.3" = { en = "The arrow turns green when it points at a team-mate (a pass) and pink when it points at the goal (a shot). Releasing near a target snaps to it, so you don't need to be exact. The ball spins towards the most useful target first.", de = "Der Pfeil wird grün, wenn er auf einen Mitspieler zeigt (Pass), und pink, wenn er aufs Tor zeigt (Schuss). Loslassen in der Nähe eines Ziels rastet ein, du musst also nicht exakt sein. Der Ball dreht sich zuerst zum nützlichsten Ziel." }
"help.4" = { en = "Defenders who reach your carrier steal the ball. Keep it moving: pass, pass, shoot.", de = "Verteidiger, die deinen Ballführer erreichen, stehlen den Ball. Halte ihn in Bewegung: passen, passen, schießen." }
"help.5" = { en = "Start with Training: the first drills have no opponents, then dummies, then defenders that get faster each level.", de = "Beginne mit dem Training: Die ersten Übungen haben keine Gegner, dann Dummys, dann Verteidiger, die mit jedem Level schneller werden." }
"help.6" = { en = "The season has a league and a cup, played in five worlds. Your team's automatic play follows the tactics on the coach's board.", de = "Die Saison hat eine Liga und einen Pokal, gespielt in fünf Welten. Das automatische Spiel deines Teams folgt der Taktik auf der Trainertafel." }
"help.next" = { en = "NEXT", de = "WEITER" }
"help.done" = { en = "GOT IT", de = "ALLES KLAR" }

