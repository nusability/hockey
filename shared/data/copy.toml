# The copy (spec §14, conventions: Copy), declared once and generated by tools/generate-data.py
# into ios/Sources/Localizable.xcstrings and android/app/src/main/res/values*/strings.xml.
# Neither platform's resource file is edited by hand. Club, world, formation and drill names live
# next to what they name (teams.toml, drills.toml) and are generated into the same files.
#
# Every key has English and German. `{name}` is a placeholder; it becomes a positional string
# argument (%1$@ on iOS, %1$s on Android), numbered in order of first appearance in the English.
# The Android resource name is the key with "." replaced by "_".
#
# Taken from the web prototype's text (not its code) with three edits: HTML emphasis is dropped
# (the UI is 3D text), emoji are dropped (conventions: no emoji in UI chrome), and the prototype's
# offside/icing banners and the board's passing/shooting sliders are left out (spec: out of scope
# and §12). Engine banners got proper keys (event.*).

[copy]
