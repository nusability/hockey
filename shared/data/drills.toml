# The eight training drills (spec §10), in unlock order, declared once and generated into both
# apps by tools/generate-data.py.
#
# Positions are absolute pitch coordinates; the player's side attacks +Z. Roles: G goalie,
# D defender, F forward, O dummy (static, or patrolling between its start and `patrol`).
# `speed` multiplies top speed (1.0 when absent — the spec's "at speed" column names every other
# value). `rule`: "none", "assist" (goals count only after a pass) or "free_play" (§10).
# `ball_to` is the index in `home` of the player who starts with the ball.

[[drill]]
id = "shot"
world = "magicwood"
goals = 3
seconds = 60.0
rule = "none"
ball_to = 0
home = [{ role = "F", x = 0.0, z = -2.0 }]
away = []
name = { en = "First shot", de = "Erster Schuss" }
hint = { en = "Touch and hold anywhere: the ball circles your player. Lift your finger when the arrow points at the goal.", de = "Irgendwo tippen und halten: Der Ball kreist um deinen Spieler. Hebe den Finger, wenn der Pfeil aufs Tor zeigt." }

[[drill]]
id = "pass"
world = "oasis"
goals = 3
seconds = 90.0
rule = "assist"
ball_to = 0
home = [{ role = "F", x = -7.0, z = -6.0 }, { role = "F", x = 7.0, z = 4.0 }]
away = []
name = { en = "Give and go", de = "Doppelpass" }
hint = { en = "Lift when the arrow points at your team-mate to pass. Goals only count after a pass.", de = "Hebe den Finger, wenn der Pfeil auf deinen Mitspieler zeigt, um zu passen. Tore zählen nur nach einem Pass." }

