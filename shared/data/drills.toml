name = { en = "Beat the goalie", de = "Torwart überwinden" }
hint = { en = "The goalie follows the ball. Shoot early, or pass across to pull the goalie out of position.", de = "Der Torwart folgt dem Ball. Schieße früh oder spiele quer, um den Torwart aus der Position zu locken." }

