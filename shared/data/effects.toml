# What is alive in each world (spec §13, ADR 0007): declared once here, baked into the world assets by
# tools/build-worlds.sh (each effect is the mesh `fx_<id>` in its world's .glb/.usdz) and generated
# into both apps by tools/generate-data.py, which drive every effect with the same formulas on the GPU.
# Presentation only: effects run on the renderer's clock, never on the match's, and draw no randomness
# at run time — every layout is baked into the asset (a fixed seed per effect in its build script).
#
# Units: metres, seconds, radians per second. Colour comes from the world's palette, as everywhere.
#
#   shading   lit        the world shader (ADR 0006), moved by `motion`
#             glow       unlit palette colour × pulse, moved by `motion` (what the prototype lit by emission)
#             soft       palette colour × a soft falloff × pulse × opacity, blended by `blend`, moved by
#                        `motion` — glow pools, halos, mist, cloud wisps, light shafts (no fog: these are meshes)
#             particles  camera-facing sprites: palette colour × a soft disc × opacity, blended by `blend`
#   blend     add | alpha                                 (soft and particles only)
#   motion    none | sway | orbit                         (not particles)
#     sway    = [x, y, z] amplitude at weight 1, sway_rate — each vertex's weight and phase are baked:
#               offset = sway ⊙ (0.77·sin(ωt+φ) + 0.23·s2, same, 0.77·cos(0.82ωt+1.3φ) + 0.23·s2),
#               s2 = sin(2.45ωt+1.9φ) — the prototype's vertex sway
#     orbit   = spin (rad/s) about the vertical through `pivot`, on ellipses `ellipse` (z : x) — each
#               vertex's speed factor in [−1, 1] is baked; `sway` then bobs the whole piece
#   pulse     = [base, a1, ω1, a2, ω2]: brightness base + a1·sin(ω1t+φ) + a2·sin(ω2t+1.7φ), φ baked per
#               piece (particles: per sprite). Absent: a steady 1. For particles it scales the sprite's size.
#   particles size (half-width, m), size_spread (± fraction), opacity, travel (m/s, the sprites wrap every
#             `wrap` metres, 0: they stay), wobble (m) at wobble_rate, over_pitch (may cross the pitch:
#             only falling snow does).

# Reduce Motion: every amplitude and every rate is multiplied by these — calmer, never still.
[calm]
amplitude = 0.4
speed = 0.6

