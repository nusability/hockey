# How a match looks, sounds and feels (spec §5.2 aim arrow, §8.6 camera choreography, §8.8 feedback,
# §13 worlds, §16.4 banners), declared
# once and generated into both apps by tools/generate-data.py — into the app targets, never into the
# simulation core: nothing here can change what a tick does. The time-scale numbers of §8.6 are the
# rules' own (rules.toml [slow_motion]); this file holds only what the camera and the scene do.
# Each world's light lives next to the world, in teams.toml [world.look]; the shading that uses it
# is the prototype's, computed by our own unlit materials on both platforms (ADR 0006).
#
# Units are metres, seconds, degrees for fields of view, radians for angles; colours are sRGB.
# Rates are exponential: a value approaches its target by 1 − exp(−rate·dt) per frame of real time.

[camera]
hud_fov = 50.0             # vertical, degrees: the HUD is laid out for this and rescaled to the live one
near = 0.1
far = 600.0                # beyond the sky dome (r = 320)

# The play camera, exactly the web prototype's: high and steep behind the play. It follows a focus on
# the pitch's axis that eases toward a share of the ball's z; the eye sits at (0, height, focus − back)
# and looks at (0, 0, focus + look). Each frame the field of view is fitted so the pitch's width
# (half_width either side) fills the screen at the point (0, 0, focus − fit_near):
# hfov = 2·atan(half_width / d), vfov = 2·atan(tan(hfov / 2) / aspect), clamped to min_fov…max_fov.
[camera.play]
height = 36.0
back = 20.0
look = -4.0
follow = 0.85              # the focus eases toward clamp(ball z × follow, min_z, max_z) …
min_z = -7.0
max_z = 14.0
rate = 2.2                 # … at this rate
half_width = 16.5          # the pitch's half-width (15) and a margin of 1.5
fit_near = 8.0
min_fov = 45.0
max_fov = 78.0

# A shot about to score (§8.6): the camera drops and closes in behind the ball, toward the net.
[camera.buildup]
height = 8.0
back = 20.0
fov = 44.0
weight = 0.4               # blended this far toward the play camera, never a cut
rate = 5.0

# A goal: low beside the net on the side the ball came from, sweeping round behind it and rising.
[camera.goal]
radius = 13.0
height = 4.5
rise = 1.1                 # metres per second of real time, for at most `sweep_seconds`
start_angle = 1.8          # from the outward axis
sweep = 0.14               # radians per second of real time
sweep_seconds = 4.5
look_height = 0.4
fov = 46.0
weight = 1.0
rate_in = 4.0
rate_out = 1.6             # back to the play camera once the face-off comes

# Reduce Motion keeps the slow motion (§8.6) and tames the camera: the goal camera blends in only
# part of the way and does not sweep; the shake is tamed ([camera.shake] reduce_motion).
[camera.reduce_motion]
goal_weight = 0.35
buildup_weight = 0.15

# The prototype's shake: a kick of this many metres that falls off linearly at `decay` metres per
# second of real time; while it lasts the world is offset across and up by up to half of it, jittering
# at `frequency`. The boards shake nothing. Reduce Motion keeps `reduce_motion` of every kick.
[camera.shake]
goal = 1.2
post = 0.5
decay = 2.5
frequency = 21.0           # Hz
reduce_motion = 0.2

# The players, exactly the web prototype's disks (ADR 0006): a squat body of the player's radius
# (spec §3) in the kit's primary, slightly narrower at the foot, toon-shaded; on top a dot in the
# secondary — a ring for a goalie. A training dummy (§10 'O', radius 0.9) is a taller grey body with
# an orange band. Under each a soft disc in its primary, darker under the carrier; under the receiver
# of the pass a release would snap to (§5.2), a pulsing green ring. Measures are metres, or shares
# of the player's radius where named so.
[player]
height = 0.45
foot = 0.92                # the body's radius at the foot, of the radius
segments = 28
dot = 0.45                 # the outfield player's dot, of the radius
ring_inner = 0.45          # the goalie's ring, of the radius
ring_outer = 0.8
shadow_margin = 0.2        # the disc under a player: radius + this
shadow_opacity = 0.2
carrier_shadow_opacity = 0.55
target = "#4ade80"         # the receiver's ring: radius + target_inner … radius + target_outer
target_inner = 0.25
target_outer = 0.55
target_opacity = 0.9
target_pulse = 0.08        # its scale breathes by this share …
target_pulse_rate = 10.0   # … at this rate (radians per second of real time)
# §16.4: the offside mark (the ice sport only, §8.9) — the receiver's ring above, in the player's own
# kit primary, pale and unpulsed, lying on the pitch under them. It fades in and out over
# `offside_fade` seconds of real time as the core's answer changes, so a player who crosses the line
# and comes back does not flicker.
offside_opacity = 0.4
offside_fade = 0.12
lean = 0.02                # a running player leans into its run: radians per m/s …
max_lean = 0.18            # … up to this
hop = 0.45                 # the scorers' team hops during a goal celebration (m)
hop_rate = 9.0             # radians per second of real time
kit_clash = 90.0           # sRGB distance under which the away side wears its secondary as primary
# Drills have no clubs (§10): the player's side wears their own team's kit (the demo club's before a career), the opponents this one.
sparring_primary = "#94a3b8"
sparring_secondary = "#f8fafc"

[dummy]
body = "#94a3b8"
stripe = "#f97316"
height = 0.7
stripe_height = 0.18
stripe_at = 0.6            # the band's centre, of the height
stripe_grow = 1.01         # the band's radius, of the body's

# The ball: a toon sphere (field) or a flat toon cylinder (ice puck) of the ball's radius, with a
# small glowing disc under it, like the prototype's.
[ball]
field = "#fff3b0"
ice = "#16161d"
puck_height = 0.2
disc = "#facc15"
disc_radius = 0.8
disc_opacity = 0.35

# §5.2: the aim arrow — the prototype's exactly — shown only for the player's own carrier. It is
# anchored at the carrier's centre and turned by the orbit angle, so it points out through the ball,
# never at the target. Along it: a tapered ribbon (width × ribbon_near at its start to × ribbon_far at
# its end) printed with chevrons, one every `chevron` metres, scrolling outward at `scroll` chevrons a
# second; under it an additive glow ribbon (× glow_near … × glow_far); at its end a notched arrowhead
# — the outline `head` (x, z pairs: tip, one wing, the notch; the other wing mirrored) × head_scale —
# over an additive copy × head_glow. The ribbon starts `start` outside the orbit radius (§5.1).
# Its length: free — max_length; a pass — distance to the receiver − orbit radius − pass_short; a shot
# — distance to the goal centre − orbit radius − shot_short; always stopped board_margin + orbit
# radius short of the boards (marching out from 1 m in steps of probe_step, up to max_length + 2, to
# the last point whose distance to the boundary (§1) is under −board_probe), and never under
# min_length. Colours: free, pass, shot (the help text's green and pink, copy help.3). Snapped, the
# ribbon and head pulse at opacity_snapped ± pulse at pulse_rate (radians per second of real time);
# free, they stand at opacity_free.
[aim]
free = "#facc15"
pass = "#4ade80"
shot = "#f472b6"
start = 0.35
max_length = 16.0
min_length = 2.5
pass_short = 1.6
shot_short = 1.2
board_margin = 1.2
board_probe = 0.6
probe_step = 0.5
width = 1.1
ribbon_near = 0.62
ribbon_far = 0.3
glow_near = 1.0
glow_far = 0.5
chevron = 1.3
scroll = 2.4
head = [0.0, 1.3, 0.95, -0.2, 0.0, 0.25]
head_scale = 1.1
head_glow = 1.3
opacity_free = 0.7
opacity_snapped = 0.85
pulse = 0.15
pulse_rate = 14.0
glow_free = 0.1
glow_snapped = 0.16
head_glow_free = 0.15
head_glow_snapped = 0.22
lift = 0.04                # the ribbon's height above the pitch; the glow sits just under it
orbit = "#ffffff"          # the ring the ball circles on (§5.1), only round the player's carrier
orbit_opacity = 0.5
orbit_width = 0.1

# The lock-on marker (§5.2): when a snap begins it fades in over `fade_in` seconds of real time. A pass:
# the receiver's pulsing ring ([player] target) and a dotted line in the pass colour from the arrow's
# tip to the receiver's lead point — a dot of `dot` metres every `dot_gap` metres at dot_opacity. A
# shot: a glow in the shot colour across the goal mouth — a sheet filling the mouth (the posts' width,
# mouth_height tall) at mouth_opacity and a strip on the pitch mouth_depth deep in front of the line at
# strip_opacity, breathing by mouth_pulse at pulse_rate.
[aim.lock]
fade_in = 0.08
dot = 0.16
dot_gap = 0.55
dot_opacity = 0.45
mouth_height = 1.9
mouth_opacity = 0.2
mouth_depth = 1.4
strip_opacity = 0.28
mouth_pulse = 0.25

# §8.8: a loose ball faster than min_speed draws a ribbon behind it through where it was over the
# last `seconds` of match time — width `width` at the ball tapering to nothing, opacity `opacity`
# fading to nothing — faded in and out over `fade_speed` m/s above min_speed. Field ball: it rolls
# (its spin follows its travel over its radius); puck: it spins at puck_spin radians per second.
[trail]
colour = "#fde68a"
min_speed = 6.0
fade_speed = 3.0
seconds = 0.16
width = 0.5
opacity = 0.6
samples = 24
puck_spin = 4.0

# §8.8: a goal's confetti, thrown at real time from the scored-in net in the scoring side's primary,
# secondary and white (in turn): `pieces` cards of `size`, each from within ±spread across and
# ±depth along the goal line at a height in `height`, thrown across and along within ±sideways and
# up within `up`, falling at `gravity`; under `floor` it bounces (vertical speed × −bounce, the
# rest × friction). Each tumbles about two axes within ±spin radians per second and lives a time
# within `life`.
[celebration]
pieces = 160
size = [0.3, 0.07, 0.42]
spread = 4.0
depth = 2.0
height = [1.0, 3.0]
sideways = 9.0
up = [6.0, 16.0]
gravity = 18.0
floor = 0.1
bounce = 0.3
friction = 0.8
spin = 6.0
life = [1.8, 2.8]

# §8.8: a save, a steal or a block pops at the spot: a flat ring grows from radius_from to radius_to
# over `seconds` of real time, fading from `opacity`, in the kind's colour; the ring is `width` of its
# radius wide (from (1 − width) × radius to the radius).
[pop]
seconds = 0.35
radius_from = 0.5
radius_to = 2.0
width = 0.18
opacity = 0.85
save = "#ffffff"
steal = "#fb7185"
block = "#fdba74"

# §8.8: the net is the apps' own — a world's asset carries the goal frame (posts and crossbar) and
# nothing else, so the whole net moves. Each goal is four sheets — the back, the roof and the two
# sides — every one of them a cord grid over a translucent film: `columns` cells across the mouth,
# `rows` up the back and the sides, `depth` along the goal's depth. A cord is `cord` wide and stands
# `cord_lift` off its film so the two never fight. The film is `colour` at `opacity`; the cords take
# the world's own net colour (teams.toml [[world]] `net`).
#
# **The net does not move.** The owner could not see the cloth answer the ball on either phone, and
# rather than keep a mechanism nobody can see, both motions are off: the idle sway (below) and the
# ball's dent are both zero amplitude. The machinery is kept and tested — contact detection, the
# wave's shape, the lacing that holds the four sheets together — so turning it back on is a number,
# not a rewrite. SMASH-44 carries the open question of why it never read on a device.
#
# The shape the dent would take: displacement = amplitude × strength × bell × e^(−decay·t) ×
# sin(frequency·t − k·r) × e^(−r/reach), r the distance from the contact, t real seconds since it,
# for `seconds`. `strength` is the ball's speed **into** the sheet over `hit_speed`, capped at 1.
[net]
colour = "#f8fafc"
height = 1.9               # the goal's height (the worlds' goal frames)
opacity = 0.22
columns = 12
rows = 5
depth = 4
cord = 0.05
cord_lift = 0.012
amplitude = 0.0            # still: the net does not answer the ball for now (SMASH-44)
hit_speed = 22.0           # m/s into a sheet for the full dent
hit_least = 2.0            # slower than this and the cloth does not answer
decay = 3.2
frequency = 18.0
k = 4.0
reach = 2.5
seconds = 1.6

# The cloth hangs still until the ball strikes it (§8.8): a net that billows on its own reads as
# wind on a pitch that has none, and it draws the eye away from the play. `bell` is
# sin(π·u)·sin(π·v) over the sheet's own grid — nothing at the edges the net is laced to, most in
# the middle — and it shapes the ball's dent, which is now the only thing that moves the net.
[net.sway]
amplitude = 0.0            # still: no idle cloth (§8.8)
seconds = 3.6
wave = 1.1                 # radians of phase per metre
reduce_motion = 0.4


# §16.4: the banners the match raises (the prototype's), each shown for its seconds of real time and
# then leaving. Styles: good (a goal of ours, a win: popped big in the sun colour), bad (a goal
# against, a loss, a drill interrupted), warn (a dead-ball reset), info (the intro, periods, the
# drills' get ready). The heights are metres on the HUD plane.
[banner]
versus = 2.2
period = 1.5
period_end = 2.4
whistle = 1.8
ready = 0.9
lost = 1.2
goal = 2.4
end = 1.5
good = "#facc15"
bad = "#fb7185"
warn = "#fdba74"
info = "#22d3ee"
height_good = 0.34
height_bad = 0.3
height_warn = 0.24
height_info = 0.2

# §8.8: haptics, on the system's haptic setting. Intensities are 0–1. A light tick when the player's
# carrier's aim enters a pass or shot window; a release's impact from release_low at release_slow m/s
# to release_high at release_fast; a sharp transient for a steal, a save or a post; three pulses with
# the goal horn at goal_pulses seconds (a goal of ours; one soft pulse for a goal against); a soft tick
# with each countdown second.
[haptics]
window = 0.35
release_low = 0.35
release_high = 1.0
release_slow = 12.0
release_fast = 30.0
sharp = 0.9
goal = 1.0
goal_pulses = [0.0, 0.5, 1.0]
against = 0.4
tick = 0.25

# §8.8: sound (shared/data/sounds.toml). A sound made on the pitch (the ball's: a shot, a pass, a
# board, a post, a save, …) plays at rate = pitch × time scale (§8.6), clamped to min_rate…max_rate,
# and pans with the ball: x / 15 × pan (x the ball's across the pitch); every other sound plays at
# its pitch, centred. A shot sounds soft, medium or hard by the third of shot_slow…shot_fast its
# speed falls in. The last `countdown` seconds of a period (or a drill) tick; the result sting
# sounds sting_delay seconds of real time after the end. The playback layer has `voices` voices.
[sound]
min_rate = 0.5
max_rate = 2.0
pan = 0.6
shot_slow = 12.0
shot_fast = 30.0
countdown = 5
voices = 16                # the playback layer's voices, shared by every cue
sting_delay = 1.3

[hud]
depth = 4.0                # metres in front of the camera
margin = 0.04              # of the half-height, inside the safe area
score_height = 0.15
clock_height = 0.085
banner_height = 0.28
text = "#ffffff"
clock = "#ffe8a3"
button = "#ffc83d"
button_label = "#1e1b4b"
button_size = 0.22

# The screens (spec §16): where the camera stands for each menu — `eye` and `target` in the world's
# coordinates (the pitch centred on the origin, §1) — so the demo match (§9) plays behind every one
# of them. Getting from one to the next is a camera swoop (the `swoop` spring, motion.json); the
# match itself is the play camera above. Each menu is laid out on a plane 4 m in front of its eye
# (the UI kit's design frame), the same numbers on both platforms.
[screens]
demo_rest = 4.0            # seconds the finished demo stands before the next world's kicks off (§9)
result_delay = 1.8         # seconds from the final whistle to the result screen, the banner up
leave_seconds = 1.2        # a screen's parts are gone this long after it starts leaving

[screens.title]
eye = [0.0, 4.2, -22.0]
target = [0.0, 6.2, 20.0]

[screens.team]
eye = [-17.0, 7.0, 16.0]
target = [4.0, 2.0, -6.0]

[screens.hub]
eye = [-19.0, 10.0, -14.0]
target = [2.0, 3.0, 8.0]

[screens.detail]           # a team's detail, its own screen off the hub (§16.3a)
eye = [-22.0, 8.0, 2.0]
target = [-2.0, 3.0, -6.0]

[screens.training]
eye = [18.0, 7.0, 14.0]
target = [-4.0, 2.0, -4.0]

[screens.coach]
eye = [19.0, 8.0, -8.0]
target = [-3.0, 2.0, 12.0]

[screens.help]
eye = [-14.0, 5.0, 2.0]
target = [6.0, 3.0, 16.0]

[screens.result]
eye = [5.0, 3.2, 12.0]
target = [0.0, 2.2, 30.0]

[screens.refused]
eye = [0.0, 12.0, -40.0]
target = [0.0, 4.0, 0.0]
