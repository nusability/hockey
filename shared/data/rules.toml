# The simulation's numbers (spec §1, §3–§8, §11), declared once and generated into both apps by
# tools/generate-data.py. Every value cites its spec section; changing one is a spec change, and
# where it touches the simulation it moves a golden vector (§4.7).
#
# Types are TOML's: an integer is a count or an index, a float is a quantity. Keys become
# camelCase constants under `Tuning.<Table>` (Swift) / `Tuning.<Table>` (Kotlin).

[time] # §4.1–§4.2
steps_per_second = 240          # the fixed step is 1/240 s
steps_per_tick = 2              # a tick is 1/120 s: two steps
max_real_gap = 0.1              # real-time gaps are clamped to this (s)
real_units_per_tick = 1000000000  # real time is counted in whole 1/(120·10⁹) s, so 60 Hz and 120 Hz frames sum exactly

[sim] # §4.4 — numerical guards, identical on both platforms (not tunables)
contact_epsilon = 0.0001        # overlaps closer than this are left alone (no direction to push along)
direction_epsilon = 0.000001    # a vector shorter than this has no direction (normalizes to zero)
clear_epsilon = 0.001           # a target this close to what it keeps clear of is pushed along +x

[pitch] # §1
half_width = 15.0               # x
half_length = 30.0              # z
goal_line_z = 26.0
blue_line_z = 9.5               # §1, §8.9: each blue line, this far from centre — the ice sport's zones
goal_mouth_width = 6.0
goal_depth = 1.6
net_frame_margin = 0.15         # the net's frame, for the ball, on every outer side (6.3 × 1.75)
crease_radius = 3.2
post_x = 3.0                    # §6.2: posts at x = ±3.0 on each goal line
post_radius = 0.18
post_restitution = 0.8
players_per_side = 6
faceoff_center = { x = 0.0, z = 0.0 }
faceoff_neutral = [{ x = -7.0, z = -7.0 }, { x = 7.0, z = -7.0 }, { x = -7.0, z = 7.0 }, { x = 7.0, z = 7.0 }]
faceoff_end = [{ x = -7.0, z = -20.0 }, { x = 7.0, z = -20.0 }, { x = -7.0, z = 20.0 }, { x = 7.0, z = 20.0 }]

[player] # §2.1, §3
outfield_radius = 0.8
goalie_radius = 1.0
dummy_radius = 0.9              # §10
rating_origin = 60.0            # skill = clamp((rating − 60) / 30, 0, 1); speed 6.2 + (rating − 60) × 0.045
skill_span = 30.0
outfield_speed_base = 6.2
outfield_speed_per_rating = 0.045
goalie_top_speed = 4.8
acceleration_rate = 4.75        # 38/8: velocity approaches the wanted velocity by 1 − exp(−4.75·dt)
arrive_gain = 6.0               # wanted speed min(top, 6·d)
arrive_dead_zone = 0.02
turn_rate = 14.0                # facing turns by angleDiff × min(1, 14·dt)
turn_min_speed = 0.6

[orbit] # §5.1–§5.2
radius = 1.5
demo_period = 2.0               # the orbit period in the demo match
spin_goal_range = 24.0          # turn toward the goal first within 24 and |x| < 13
spin_goal_max_x = 13.0
spin_mate_min_distance = 3.0
spin_openness_cap = 9.0
spin_progress_weight = 0.4
spin_distance_free = 18.0
spin_distance_weight = 0.5
pass_window = 0.36              # rad
lead_velocity_factor = 0.8      # lead position: position + 0.8 × velocity × t
lead_speed_min = 14.0           # t = distance / max(14, 11 + 0.55 × distance)
lead_speed_base = 11.0
lead_speed_per_metre = 0.55
goal_window = 0.40              # rad
goal_window_widen = 0.30        # widened by up to 0.30 as the carrier closes from 14 to 0
goal_window_widen_distance = 14.0
goal_over_pass_ratio = 0.9      # the goal wins when its angle < 0.9 × the pass's
goal_force_distance = 9.0       # … or the carrier is within 9 of goal

[release] # §5.3–§5.4
late_grace = [0.0625, 0.125, 0.1875, 0.25]      # instants looked back at (s)
early_look = [0.05, 0.10, 0.15, 0.20, 0.25]     # instants looked ahead at (s)
pending_fallback = 0.06         # unassisted this long after the instant if nothing snaps
pass_speed_base = 14.0          # clamp(14 + 0.85 × distance, 14, 30)
pass_speed_per_metre = 0.85
pass_speed_min = 14.0
pass_speed_max = 30.0
pass_noise = 1.6                # noise(1.6 × (1.15 − accuracy))
pass_noise_offset = 1.15
pass_expectation = 1.6
pass_expectation_decay = 0.2
shot_speed = 30.0
shot_post_inset = 0.85          # aims at ±(3.0 − 0.85)
shot_pull = 0.3                 # pulled to 30 % on a 25 % draw
shot_pull_chance = 0.25
shot_noise = 1.5                # noise(1.5 × (1.2 − accuracy))
shot_noise_offset = 1.2
free_speed = 24.0
player_accuracy = 1.0
carrier_velocity_inherit = 0.2
goal_guard_z = 25.7             # a release point with |z| > 25.7 and |x| < 3.6 …
goal_guard_x = 3.6
goal_guard_clamp_z = 25.5       # … is moved to the carrier, z kept within 25.5
releaser_cooldown = 0.45
shot_side_chance = 0.5          # with no goalie, −x on a draw below 0.5, else +x

[ball] # §6
max_speed = 30.0
board_hit_speed = 4.0
player_restitution = 0.85
goalie_restitution = 0.35
