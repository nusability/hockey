press_range_discipline = 0.35
orbit_lead = 0.3

[ai.alert] # §7.9 — the alert window a carried ball crossing the centre line opens on the defence
seconds = 3.0                   # how long the defending team stays sharp after the crossing
goalie_read_scale = 0.5         # the goalie's reading delay while alerted, as a share of §7.8's
goalie_aim_factor = 1.0         # it goes to the whole predicted crossing x, not 0.9 of it
goalie_lead = 1.0               # and predicts with a full lead, whatever its skill
place_full = 20.0               # a shot from this far out is placed straight at the goal centre …
place_span = 10.0               # … and picks its corner in full from 10 in (§5.4)
close_range = 14.0              # the alert ends once the carrier is this near the goal it attacks
lane_ahead_max = 4.5            # the lane blocker stands this far in front of the carrier, at most …
lane_ahead_fraction = 0.35      # … and at most this share of the way to the goal it defends

[offside] # §8.9 — the ice sport only: an attacker may not be in the zone before the puck
clear_depth = 4.0               # the zone, once entered, is not clear again until the puck is this far back out
player_margin = 0.6             # a skater is offside only this far beyond the line: standing on it is onside
puck_margin = 0.2               # the AI holds the line while the puck is still this far short of it (§7.4)
hold_back = 0.8                 # … by keeping its target this far short of the line
miss_chance = 0.1               # the referee misses this share of offside entries — one draw at the call (§4.3)
faceoff_reference_z = 7.0       # the restart is the neutral spot nearest (the puck's x, direction × 7.0)

[ai.balance] # §7.10 — the rubberband: a match tilts back toward whichever side is behind
temperament_base = 1.05         # temperament = clamp(1.05 + noise(0.8), 0, 1.8), drawn once at set-up
temperament_noise = 0.8
temperament_max = 1.8
lead_free = 1.0                 # excess = max(|lead| − 1, 0): a one-goal lead is not a lead
lead_full = 2.0                 # band = min(excess / 2, 1): full from three clear
ramp_base = 0.45                # ramp = 0.45 + 0.55 × progress through the three periods
ramp_per_progress = 0.55
tilt_max = 1.0                  # r = min(temperament × band × ramp, 1)
hold_pressing = 0.6             # the side ahead: pressing × (1 − 0.6 × hold) …
hold_push_up = 0.8              # … push up × (1 − 0.8 × hold) …
hold_shooting = 0.85            # … shooting × (1 − 0.85 × hold), an AI carrier only (§7.6, §12) …
hold_discipline = 0.4           # … and discipline + (1 − discipline) × 0.4 × hold: it holds its shape
chase_pressing = 0.6            # the side behind: pressing + (1 − pressing) × 0.6 × chase …
chase_push_up = 0.6             # … push up + (1 − push up) × 0.6 × chase …
chase_covering = 0.45           # … covering + (1 − covering) × 0.45 × chase …
chase_goalie_read = 0.6         # … its goalie's reading delay × (1 − 0.6 × chase) (§7.8) …
chase_alert = 1.0               # … and its alert window lasts 3.0 × (1 + 1.0 × chase) s (§7.9)

