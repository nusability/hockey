steal_time = 0.18
steal_decay_factor = 2.0        # contact is lost twice as fast out of reach
steal_loser_cooldown = 0.6
dead_speed = 2.5
dead_time = 8.0
dead_slow_factor = 0.2
whistle_delay = 1.4
goal_mouth_inset = 0.3          # a goal needs the ball within 3.0 − 0.3·r of the centre …
goal_line_margin = 0.5          # … in front of the line by at least −0.5·r, then across it by more than 0.5·r
net_roll_drag = 4.0             # §8.1: a ball in the net after a goal slows by exp(−4·dt) per step …
net_roll_bounce = 0.2           # … and bounces off the net's back and sides keeping 20 % of its speed

[ai] # §7
