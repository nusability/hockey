# What is kept on the device (spec §15), declared once and generated by tools/generate-data.py
# into both apps: the record types (Swift structs, Kotlin data classes) and their JSON encoding and
# decoding. The on-disk JSON is canonical — the same state writes the same bytes on both platforms
# (shared/vectors/season/save/ proves it):
#
#   - an object's keys in the order declared here, every key always present (an absent optional
#     is null); two-space indentation, one value per line, "key": value, a final newline;
#     an empty array is []
#   - int: a JSON integer · bool: true / false · string: UTF-8, escaping only " \ and U+0000–U+001F
#     (\b \t \n \f \r, else \u00xx)
#   - u64: "0x" and 16 uppercase hex digits (a JSON number cannot hold 64 bits)
#   - double: its IEEE-754 bits, as a u64 — exact on both platforms, no decimal formatting
#   - rgb: "#RRGGBB", uppercase
#   - club, world, formation, drill, team: the key as declared in teams.toml / drills.toml
#     (team: a club's key, or the created team's, teams.toml career.created_id)
#   - [T]: a JSON array · T?: the value or null
#
# Decoding fails loud and typed — malformed JSON, a missing, unknown or duplicated key, a wrong
# type, an undeclared key or value, a value that breaks a rule of the spec, and above all a version
# other than this one — and never yields an empty save in place of a broken one (conventions.md,
# greenfield: until the first store submission these shapes change without migration, so a record
# of another version is refused, not read).
#
# A record's fields are declared in order as `name = "type"`; `_doc` documents the type and
# `_validate = true` makes decoding call the record's hand-written rule check (Season/ on both
# platforms). The first record is the file's root, and its `version` must equal [format] version.

[format]
version = 1

[record.SaveRecord]
_doc = "Everything the game keeps on the device (spec §15): the root of the save file."
_validate = true
version = "int"
career = "CareerRecord?"
season = "SeasonRecord?"
training = "TrainingRecord"
board = "BoardRecord"

[record.CareerRecord]
_doc = "The career (spec §2.2): the team the player created — there is no other — and the trophy counts (§11.4)."
_validate = true
created = "CreatedTeam"
league_titles = "int"
cups = "int"

[record.CreatedTeam]
_doc = "The player's own team (spec §2.2): name, short code, kit and home world. Its rating is fixed (Career.createdRating)."
name = "string"
short = "string"
primary = "rgb"
secondary = "rgb"
world = "world"

[record.SeasonRecord]
_doc = "The season in progress (spec §11, §15): its number in the career (the first is 1, each next season one more; starting over begins again at 1), its stream's seed and position, the league's teams, every fixture drawn so far with its score, and the matchday — the index in Season.plan of the next matchday to play; Season.plan.count once the final is played. The table and the cup bracket follow from the fixtures."
_validate = true
number = "int"
seed = "u64"
stream = "u64"
teams = "[team]"
matchday = "int"
fixtures = "[Fixture]"

[record.Fixture]
_doc = "One match of the season (spec §11.1): the matchday (an index in Season.plan), the teams, and the score once it is played or simulated."
home = "team"
away = "team"
matchday = "int"
score = "Score?"

[record.Score]
_doc = "A fixture's score (spec §11.3): goals for the home and the away side; `overtime` when a level cup match was decided in overtime."
home = "int"
away = "int"
overtime = "bool"

[record.TrainingRecord]
_doc = "Training progress (spec §10): the drills won, in the order they were first won. Survives starting over (§2.2)."
_validate = true
won = "[drill]"

[record.BoardRecord]
_doc = "The coach's board (spec §12)."
_validate = true
pressing = "double"
covering = "double"
push_up = "double"
discipline = "double"
formation = "formation"
period_seconds = "double"
ball_spin_seconds = "double"
