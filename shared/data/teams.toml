# §12 — the default tactics. A club lists only its differences.
[default_tactics]
pressing = 0.55
covering = 0.55
push_up = 0.55
passing = 0.55
shooting = 0.55
discipline = 0.0

# §12 — the coach's board. A 0–1 slider is continuous; the timed settings are discrete choices,
# listed so every value is an exact literal on both platforms (no 1.4 + n × 0.2 drift).
[board]
tactic_min = 0.0
tactic_max = 1.0
period_seconds = [60.0, 90.0, 120.0, 150.0, 180.0, 210.0, 240.0]
period_seconds_default = 120.0
ball_spin_seconds = [1.4, 1.6, 1.8, 2.0, 2.2, 2.4, 2.6, 2.8, 3.0, 3.2]
ball_spin_seconds_default = 2.0

