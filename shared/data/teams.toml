# Worlds, formations, tactics, the coach's board, the clubs, the career and its kit palette (spec
# §2, §3, §12, §13), declared once and generated into both apps by tools/generate-data.py. Localized names
# live next to what they name and are generated into the copy (§14).

# §13 — the five worlds, in the demo match's order (§9). Each world's look is generated into the
# apps' presentation (never the core) and lights every surface by our own shading formula on both
# platforms (ADR 0006): colour = albedo × (mix(hemi_ground, hemi_sky, 0.5 + 0.5·n.y) · hemi_strength
# + sun · sun_strength · max(0, n·l)), l the unit vector toward the sun. The values are the web
# prototype's lights (a hemisphere light and a sun); its renderer's Lambert divides by π, so each
# strength here is the prototype's intensity ÷ π. No fog (ADR 0006).
[[world]]
id = "magicwood"
sport = "field"
net = "#e2e8f0"            # the goal net's cords — the apps draw and move the net (§8.8)
name = { en = "Magic Wood", de = "Zauberwald" }
[world.look] # dusk in the wood: violet sky light over dark moss, a peach sun
hemi_sky = "#9fb2ff"
hemi_ground = "#2a3820"
hemi_strength = 0.3501   # 1.1 / π
sun = "#ffd6a6"
sun_strength = 0.6048    # 1.9 / π
sun_direction = [26.0, 50.0, -30.0]
shade = 0.7             # the toon band's dark side; the worlds keep the prototype's value

[[world]]
id = "space"
sport = "field"
net = "#bae6fd"            # the goal net's cords — the apps draw and move the net (§8.8)
name = { en = "Deep Space", de = "Tiefer Weltraum" }
[world.look] # cool starlight from above, deep violet from below
hemi_sky = "#9fd0ff"
hemi_ground = "#1a1240"
hemi_strength = 0.3342   # 1.05 / π
sun = "#fff1d8"
sun_strength = 0.6048    # 1.9 / π
sun_direction = [18.0, 60.0, -20.0]
shade = 0.7             # the toon band's dark side; the worlds keep the prototype's value

[[world]]
id = "oasis"
sport = "field"
net = "#fff1d6"            # the goal net's cords — the apps draw and move the net (§8.8)
name = { en = "Desert Oasis", de = "Wüstenoase" }
[world.look] # golden hour: warm sky, sand bounce, a low orange sun
hemi_sky = "#ffd9a8"
hemi_ground = "#b27a4c"
hemi_strength = 0.2865   # 0.9 / π
sun = "#ffc98a"
sun_strength = 0.7958    # 2.5 / π
sun_direction = [-40.0, 30.0, 14.0]
shade = 0.7             # the toon band's dark side; the worlds keep the prototype's value

[[world]]
id = "himalaya"
sport = "ice"
net = "#ffffff"            # the goal net's cords — the apps draw and move the net (§8.8)
name = { en = "Himalaya", de = "Himalaya" }
[world.look] # thin bright air: pale blue sky light, cold grey-blue shade, a warm sun
hemi_sky = "#d6e9ff"
hemi_ground = "#9fb6cc"
hemi_strength = 0.3024   # 0.95 / π
sun = "#ffe4bf"
sun_strength = 0.6366    # 2.0 / π
sun_direction = [-35.0, 46.0, -26.0]
shade = 0.7             # the toon band's dark side; the worlds keep the prototype's value

[[world]]
id = "ocean"
sport = "field"
net = "#e0fbff"            # the goal net's cords — the apps draw and move the net (§8.8)
