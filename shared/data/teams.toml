# §2.2, §9 — the career.
[career]
demo_club = "mossfoxes"          # the demo's team before a career exists (§9)
created_rating = 77              # the mean of the clubs' ratings, rounded — checked by the generator
created_replaces = "wolves"      # the weakest club, replaced in the league and cup
created_id = "created"           # the created team's key in a season and in the save (§11, §15)
name_min_length = 2              # Unicode code points, after dropping leading and trailing spaces
name_max_length = 16
short_code_length = 3
short_code_pad = "X"             # pads a derived short code short of letters; no club's code has one

# §2.2 — the created team's kit palette: twelve pairs. The primary is chosen from the primaries and
# the secondary from the secondaries; each primary's pair is the secondary it was designed with.
# The generator checks that no primary equals a club's primary (§2.2) and that every colour is
# unique. Chosen to read well against every club: the nearest palette primary to a club primary
# is Navy against the clubs' blues at CIEDE2000 17.5 (the clubs among themselves go down to 7.4,
# Rocket Lynx against Coral Kraken); every pair's WCAG contrast is at least 5.3:1. The names are
# the swatches' accessibility labels (conventions: UI).
