# Smash Hockey telemetry — a compose fragment for box #2 (`stori-monitoring`).
#
# Deploys to /opt/smashhockey/ and is fronted by the same host Caddy that already fronts Grafana,
# Umami, Bugsink, flashybird and vidi. Deliberately NOT part of stori's `monitoring/` stack: that
# repo is config-as-code for Stori, and this is a different product with its own lifecycle.
#
# Follows the box's pattern (umami-db, bugsink-db, flashybird-db, vidi-db): one small Postgres per
# service, internal only, no published port. That makes this the **seventh** Postgres on a 8 GB box —
# noted rather than shrugged at. It fits today (5.1 GB available when this was written, ~150 MB for
# this one), and the cheaper alternative if it ever gets tight is a `smashhockey` database inside an
# existing cluster, at the cost of coupling this schema to another product's container lifecycle.
#
# **Grafana is here now** (it was not, while the tables were empty). Its own instance rather than a
# folder in the box's shared one, for the three reasons ../flashybird wrote down: the shared
# instance's provisioning is config-as-code in the *stori* repo, so every panel change here would be
# a cross-repo edit into a project under active development; its `grafana_data` volume is in no
# backup, so panels made there survive only as long as the volume; and two products would share an
# upgrade cadence they have no reason to share. Here the dashboards **are** the backup — generated
# JSON in this repo, provisioned read-only, and a total loss of the volume costs a login.

name: smashhockey

services:
  smashhockey-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smashhockey
      POSTGRES_USER: smashhockey
      POSTGRES_PASSWORD: ${SH_DB_PASSWORD:?set SH_DB_PASSWORD in /opt/smashhockey/.env}
    volumes:
      - smashhockey-db-data:/var/lib/postgresql/data
      # Generated from shared/data/telemetry.toml. Runs on first boot only — a later declaration
      # change is applied by re-running it by hand (`psql -f`), because it is idempotent.
      - ./schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    networks: [smashhockey]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smashhockey -d smashhockey"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: sh -c "npm i --omit=dev --no-audit --no-fund && node server.js"
    environment:
      DATABASE_URL: postgres://smashhockey:${SH_DB_PASSWORD}@smashhockey-db:5432/smashhockey
      PORT: 3014
      # Not a secret — it ships inside the app binary. It exists so a drive-by scanner cannot write
      # rows into the dataset we make design decisions from.
      SH_INGEST_TOKEN: ${SH_INGEST_TOKEN:?set SH_INGEST_TOKEN in /opt/smashhockey/.env}
    volumes:
      - ./server.js:/app/server.js:ro
      - ./package.json:/app/package.json:ro
      # The column contract. The collector reads it at boot and builds its INSERTs from it, so this
      # mount is not optional — it is the reason there is no column list in server.js (ADR 0009).
      - ./columns.json:/app/columns.json:ro
    # Loopback only, on 3014: 3000–3003 and 3010–3013 were taken by the six services already here.
    # The host Caddy is the single public edge, exactly as it is for everything else on this box.
    ports: ["127.0.0.1:3014:3014"]
    depends_on:
      smashhockey-db:
        condition: service_healthy
    networks: [smashhockey]

  # The operator surface, on `dash.nann.in/smash` — a different host from the ingest one on purpose.
  # `ingest.nann.in` says "nothing here reads", in its vhost and its README, and that is a posture
  # worth keeping true rather than a slogan. A second hostname costs nothing now that `*.nann.in` is
  # a wildcard, which is exactly the payoff that wildcard bought.
  grafana:
    image: grafana/grafana-oss:11.5.2      # pinned to what box #2 already runs and trusts
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://dash.nann.in/smash
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${SH_GRAFANA_PASSWORD:?set SH_GRAFANA_PASSWORD in /opt/smashhockey/.env}
      # The same posture as every other login on this box: nobody signs themselves up, nobody reads
      # it anonymously. The dashboard is an operator surface, not a public page.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Read by the provisioned datasource, so the password is never written into a config file.
      SH_DB_PASSWORD: ${SH_DB_PASSWORD}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - smashhockey-grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3015:3000"]        # 3014 is the collector
    depends_on:
      smashhockey-db:
        condition: service_healthy
    networks: [smashhockey]

networks:
  smashhockey:

volumes:
  smashhockey-db-data:
  smashhockey-grafana-data:
