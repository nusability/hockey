apiVersion: 1

providers:
  - name: smashhockey
    orgId: 1
    folder: Smash Hockey
    type: file
    # Provisioned dashboards are read-only in the UI on purpose: the JSON in this repo is the source
    # of truth, and it is itself generated (build-dashboards.py). A panel edited in the browser would
    # be silently reverted on the next restart, which is worse than not being editable at all.
    # Edit the generator, run it, redeploy.
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
